<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина по танкам</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <!-- Экран самой викторины -->
        <div id="quiz-screen">
            <div class="quiz-progress" id="progress-text">Вопрос 1 из 10</div>

            <div class="image-placeholder">
                <img src="" alt="Танк" class="quiz-image" id="quiz-img">
            </div>

            <h2 class="quiz-question" id="question-text">Загрузка вопроса...</h2>

            <div class="answers-container" id="answers-box">
                <!-- Варианты ответов генерируются автоматически -->
            </div>

            <!-- Кнопка Далее -->
            <button class="next-btn" id="next-button" disabled onclick="nextQuestion()">Далее</button>
        </div>

        <!-- Финальный экран результатов -->
        <div id="result-screen" style="display: none;">
            <div class="quiz-progress">Результаты игры</div>
            <h2 class="quiz-question">Викторина завершена!</h2>
            
            <div class="percentage-box" id="percentage-result">0%</div>
            <p class="quiz-description" id="score-text">Вы ответили правильно на 0 из 10 вопросов.</p>
            
            <div class="review-container" id="review-box">
                <!-- Здесь покажется разбор ошибок -->
            </div>

            <a href="index.html" class="start-btn" style="margin-top: 20px;">Играть снова</a>
        </div>
    </div>

    <script>
        // БАЗА ДАННЫХ ВИКТОРИНЫ (ВСЕ 10 ВОПРОСОВ)
        // correct: 0 — первый вариант, 1 — второй вариант, 2 — третий вариант
        const quizData = [
            {
                question: "Какая легендарная ПТ-САУ изображена на картинке?",
                image: "placeholder.jpg",
                answers: ["FV4005 Stage II", "FV215b (183)", "Chieftain Mk. 6"],
                correct: 1
            },
            {
                question: "Какой именно танк из ветки «Yoh» перед вами?",
                image: "yoh.jpg",
                answers: ["M-III-Yoh", "M-V-Yoh", "M-VI-Yoh"],
                correct: 1
            },
            {
                question: "Какой базовый урон в минуту (DPM) имеет пушка немецкого СТ Leopard 1?",
                image: "leopard.jpg",
                answers: ["Около 2400 ед.", "Около 2700 ед.", "Около 3500 ед."],
                correct: 2
            },
            {
                question: "Какие 2 типа снарядов используются на фугаснице у T49?",
                image: "t49.jpg",
                answers: ["Подкалибер и фугас", "Бронебойный и кумулятив", "Кумулятив и фугас"],
                correct: 2 
            },
            {
                question: "Какой танк и с каким легендарным камуфляжем изображен на картинке?",
                image: "objekt907.jpg",
                answers: ["Обьект 703 II форпост", "Обьект 907 почетный", "Обьект 259А артист"],
                correct: 1
            },
            {
                question: "В каком году была полноценно добавлена механика ПТУР ?",
                image: "ptyr.jpg",
                answers: ["В 2020", "В 2017", "В 2024"],
                correct: 0
            },
            {
                question: "В каком году были изменены танки 1 уровня ?",
                image: "ms1.jpg",
                answers: ["В 2019", "В 2018", "В 2017"],
                correct: 1
            },
            {
                question: "Сколько секунд танк может полностью находиться под водой до того, как экипаж начнет тонуть?",
                image: "yoh2.jpg",
                answers: ["5 секунд", "10 секунд", "15 секунд"],
                correct: 1
            },
            {
                question: "Какой модуль при повреждении вызывает мгновенный пожар?",
                image: "tvp.jpg",
                answers: ["Топливный бак", "Двигатель", "Боеукладка"],
                correct: 0
            },
            {
                question: "У какого танка меньше всего брони во лбу корпуса на 10 уровне?",
                image: "batchat.jpg",
                answers: ["Vickers Light", "Sheridan", "Grile 15"],
                correct: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswerIndex = null;
        let userHistory = [];

        function loadQuestion() {
            const currentData = quizData[currentQuestionIndex];
            selectedAnswerIndex = null;
            
            const nextBtn = document.getElementById('next-button');
            nextBtn.disabled = true;
            nextBtn.classList.remove('active');

            document.getElementById('progress-text').innerText = `Вопрос ${currentQuestionIndex + 1} из ${quizData.length}`;
            document.getElementById('quiz-img').src = currentData.image;
            document.getElementById('question-text').innerText = currentData.question;

            const answersBox = document.getElementById('answers-box');
            answersBox.innerHTML = '';

            currentData.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.innerText = answer;
                button.onclick = () => selectAnswer(index, button);
                answersBox.appendChild(button);
            });
        }

        function selectAnswer(index, clickedButton) {
            selectedAnswerIndex = index;
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            clickedButton.classList.add('selected');

            const nextBtn = document.getElementById('next-button');
            nextBtn.disabled = false;
            nextBtn.classList.add('active');
        }

        function nextQuestion() {
            const currentData = quizData[currentQuestionIndex];
            const isCorrect = (selectedAnswerIndex === currentData.correct);
            if (isCorrect) score++;

            userHistory.push({
                question: currentData.question,
                userAnswer: currentData.answers[selectedAnswerIndex],
                correctAnswer: currentData.answers[currentData.correct],
                isCorrect: isCorrect
            });

            currentQuestionIndex++;

            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('percentage-result').innerText = `${percentage}%`;
            document.getElementById('score-text').innerText = `Вы ответили правильно на ${score} из ${quizData.length} вопросов.`;

            const reviewBox = document.getElementById('review-box');
            reviewBox.innerHTML = '';

            userHistory.forEach((item, index) => {
                const reviewItem = document.createElement('div');
                reviewItem.className = `review-item ${item.isCorrect ? 'correct-item' : 'wrong-item'}`;
                
                reviewItem.innerHTML = `
                    <div style="font-weight: 600; margin-bottom: 5px;">Вопрос ${index + 1}: ${item.question}</div>
                    <div>Ваш ответ: <span style="text-decoration: ${item.isCorrect ? 'none' : 'line-through'}">${item.userAnswer}</span></div>
                    ${!item.isCorrect ? `<div>Правильный ответ: <span style="color: #00e676;">${item.correctAnswer}</span></div>` : ''}
                `;
                reviewBox.appendChild(reviewItem);
            });
        }

        loadQuestion();
    </script>
</body>
</html>
